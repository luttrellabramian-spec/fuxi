name: CI

on:
  push:
    branches: [main, develop, v0.2.x]
  pull_request:
    branches: [main, develop, v0.2.x]

env:
  # Disable real-network tests by default (CI has no LLM access)
  SKIP_NETWORK_TESTS: "true"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. 编译 — Python + TypeScript 都能编译
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build (Python + TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install Python dependencies
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Install Node dependencies
        run: |
          cd typescript
          npm ci || npm install

      - name: Compile TypeScript gateway
        run: |
          cd typescript
          npm run build

      - name: Verify Python imports
        run: |
          cd python
          python -c "from engine.fuxi_engine import FuxiEngine; from engine.response_parser import parse_action; print('Python imports OK')"

  # ────────────────────────────────────────────────────────────────
  # 2. 单元测试 + 覆盖率
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test + Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt

      - name: Install dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Run stable core tests
        run: |
          cd python
          python -m pytest -q --timeout=30 --tb=short \
            tests/test_hot_memory.py \
            tests/test_warm_memory.py \
            tests/test_tool_registry.py \
            tests/test_engine_core.py \
            tests/test_tool_executor.py \
            tests/test_evolution.py \
            tests/test_security.py \
            tests/test_grpc_pool.py \
            tests/test_file_tools.py \
            tests/test_memory_tools.py \
            tests/test_evolution_engine.py \
            tests/test_mcp_client.py \
            tests/test_task_persistence.py \
            tests/test_tool_tracker.py

      - name: Coverage report
        run: |
          cd python
          python -m pytest -q --timeout=30 --tb=line \
            --cov=src --cov-report=xml --cov-report=term \
            tests/test_hot_memory.py \
            tests/test_warm_memory.py \
            tests/test_tool_registry.py \
            tests/test_engine_core.py \
            tests/test_tool_executor.py \
            tests/test_evolution.py \
            tests/test_security.py \
            tests/test_grpc_pool.py \
            tests/test_file_tools.py \
            tests/test_memory_tools.py \
            tests/test_evolution_engine.py \
            tests/test_mcp_client.py \
            tests/test_task_persistence.py \
            tests/test_tool_tracker.py

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: python/coverage.xml
          flags: unittests
          name: fuxi-coverage
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────
  # 3. TypeScript 编译校验
  # ────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install + Build
        run: |
          cd typescript
          npm ci || npm install
          npm run build

      - name: Verify HTML templates exist
        run: |
          test -f typescript/src/ui/chat.html
          test -f typescript/src/ui/settings.html
          echo "HTML templates OK"

  # ────────────────────────────────────────────────────────────────
  # 4. E2E 烟囱测试（不依赖 LLM，只验证可启动链路）
  # ────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke (port check + health)
    needs: [build, test, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install Python deps
        run: |
          cd python
          pip install -r requirements.txt

      - name: Install Node deps
        run: |
          cd typescript
          npm ci || npm install
          npm run build

      - name: Start gRPC service
        run: |
          cd python
          # 禁用持久化避免写文件
          FUXI_TASK_DB= "" nohup python main.py > /tmp/grpc.log 2>&1 &
          echo $! > /tmp/grpc.pid
          sleep 8

      - name: Start TypeScript gateway
        run: |
          cd typescript
          # 禁用鉴权以避免 CI 缺少 API key
          AUTH_ENABLED=false \
            nohup node dist/gateway.js > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          sleep 5

      - name: Run e2e_verify.py (without --start since services are up)
        run: |
          python scripts/e2e_verify.py

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "===== gRPC log ====="
          cat /tmp/grpc.log || true
          echo "===== gateway log ====="
          cat /tmp/gateway.log || true

      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/grpc.pid ] && kill -9 $(cat /tmp/grpc.pid) 2>/dev/null || true
          [ -f /tmp/gateway.pid ] && kill -9 $(cat /tmp/gateway.pid) 2>/dev/null || true
